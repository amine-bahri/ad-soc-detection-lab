title: LSASS Memory Dump File Written to Disk (T1003.001)
id: 8f1e2a90-1c3b-4d55-9a21-d01a55e55002
status: experimental
description: >
    A memory dump file of lsass.exe is created on disk, consistent with
    credential dumping by a file-based tool (comsvcs, ProcDump, Task Manager).
    Complements the process-access rule (rule.yml): it covers Task Manager,
    which is excluded from ProcessAccess collection at the sensor and so cannot
    be caught on EID 10.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Mohamed Amine BAHRI
date: 2026-10-18
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.dmp'
    lsass_named:
        TargetFilename|contains: 'lsass'
    dump_tool:
        SourceImage|endswith:
            - '\taskmgr.exe'
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\rundll32.exe'
    condition: selection and (lsass_named or dump_tool)
falsepositives:
    - Legitimate crash dumps or diagnostics named *lsass* or written by these tools. Rare; triage by source process and path.
level: medium
# Limitation: an attacker can name the dump file anything and write it anywhere,
# which evades the filename hint. The dump_tool source list is the more robust
# half. The behavioural rule (rule.yml, EID 10) remains the primary signal; this
# rule exists so Task Manager (A3), which EID 10 does not collect, is still caught.
