title: Suspicious Dump File Creation (possible LSASS dumping, T1003.001)
id: 8f1e2a90-1c3b-4d55-9a21-d01a55e55002
status: experimental
description: >
    A dump file (.dmp) is created on disk, either named like an lsass dump or
    written by a known dump-capable tool (comsvcs, ProcDump, Task Manager).
    This is a LEAD, not proof the dump contains lsass memory: a benign dump by
    one of these tools also matches. Corroborate with an S4 process-access event
    where one exists. For Task Manager under the current collection there is no
    S4 event (that is why this rule exists), so triage by file path, creating
    process, surrounding activity, and controlled-test ground truth instead.
    Complements the process-access rule (rule.yml): it covers Task Manager,
    which is excluded from ProcessAccess collection at the sensor.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Mohamed Amine BAHRI
date: 2026-10-18
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.dmp'
    lsass_named:
        TargetFilename|contains: 'lsass'
    dump_tool:
        Image|endswith:    # EID 11 FileCreate names the creating process in Image, NOT SourceImage
            - '\taskmgr.exe'
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\rundll32.exe'
    condition: selection and (lsass_named or dump_tool)
falsepositives:
    - Legitimate crash dumps or diagnostics named *lsass* or written by these tools. Rare; triage by source process and path.
level: medium
# Limitations: (1) an attacker can name the dump file anything and write it
# anywhere, which evades the filename hint; (2) the dump_tool branch matches any
# .dmp these tools write, including a benign dump of a non-lsass process, so it
# can false-positive. Both are why a hit is a lead to corroborate, not a verdict.
# The behavioural rule (rule.yml, EID 10) remains the primary signal; this rule
# exists so Task Manager (A3), which EID 10 does not collect, is still caught.
